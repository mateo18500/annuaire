<style id="css">
/* Layout: slim working header (search + filters), then a grid of department cards; hovering a card shows a mini map of France */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#0f1b2d; --muted:#5a6779; --line:#d9dfe8;
  --navy:#13284b; --signal:#d7262e; --signal-soft:#fde8e8; --ok:#1d7a4d; --land:#dfe4ec; --landline:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d30; --ink:#e8edf5; --muted:#9aa7bb; --line:#26334a;
  --navy:#0e1a30; --signal:#ff5a60; --signal-soft:#3a1519; --ok:#4cc38a; --land:#2a3852; --landline:#131d30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d30; --ink:#e8edf5; --muted:#9aa7bb; --line:#26334a;
  --navy:#0e1a30; --signal:#ff5a60; --signal-soft:#3a1519; --ok:#4cc38a; --land:#2a3852; --landline:#131d30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}

.mast{background:var(--navy);color:#fff;position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,#fff 14px 28px)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1;margin:0;letter-spacing:.01em}
h1 em{font-style:normal;color:#ff8a8f}
.mast p{margin:4px 0 0;color:#cfd8e6;font-size:14px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.mast .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.mast .btn.primary,.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.status{font-size:13px;color:var(--muted);width:100%}
.status.ok{color:var(--ok)} .status.err{color:var(--signal)}

main{padding-block:20px 48px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;min-width:0}
.card.first{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.plate{grid-row:1/3;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;min-width:58px;text-align:center;padding:10px 6px;border-radius:8px;background:var(--signal-soft);color:var(--signal);font-variant-numeric:tabular-nums}
.dep{font-weight:700;min-width:0;overflow-wrap:anywhere;padding-right:30px}
.centre{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0;overflow-wrap:anywhere}
.mapbtn{position:absolute;top:10px;right:10px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:0}
.mapbtn[aria-expanded="true"]{color:var(--signal);border-color:var(--signal)}
.tel{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.num{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all;white-space:nowrap}
.copy{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none}
.copy.done{color:var(--ok);border-color:var(--ok)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* Tooltip */
.tip{position:fixed;z-index:20;width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(10,20,40,.18);pointer-events:none}
.tip-t{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.tip-t span{color:var(--signal);font-family:var(--display);font-size:16px}
.tip svg{display:block;width:100%;height:auto}
.tip path{fill:var(--land);stroke:var(--landline);stroke-width:.8}
.tip path.on{fill:var(--signal)}
.tip-om{font-size:12.5px;color:var(--muted);padding:6px 0 2px}
.tip-note{font-size:11.5px;color:var(--muted);margin-top:6px}

/* Edit mode */
.card.edit{grid-template-columns:1fr;gap:8px;border-color:var(--signal)}
.card.edit label{display:grid;gap:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card.edit input{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.card.edit input.big{font-family:var(--display);font-size:22px;font-weight:700}
.row2{display:grid;grid-template-columns:80px 1fr;gap:8px}
.del{justify-self:start;font:inherit;font-size:13px;font-weight:600;color:var(--signal);background:none;border:none;padding:4px 0;cursor:pointer}
.add{border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font:inherit;font-weight:600;min-height:150px;cursor:pointer}

footer{border-top:1px solid var(--line);padding-block:18px 32px;color:var(--muted);font-size:12.5px}
footer p{max-width:80ch;margin:0 0 4px}
footer .copy-r{margin-top:10px;font-weight:600;color:var(--ink)}
</style>

  app.innerHTML =

  var grid = document.getElementById('grid'), count = document.getElementById('count'), acts = document.getElementById('acts'),

  function matches(r){

  function showTip(card){

      '<div class="tip-note">' + esc(r[2]) + '</div>';
    var p = tip.querySelector('path[data-id="' + code + '"]'); if (p) { p.classList.add('on'); p.parentNode.appendChild(p); }

    var b = card.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var left = b.right + 10; if (left + w > vw - 8) left = b.left - w - 10; if (left < 8) left = Math.max(8, Math.min(vw - w - 8, b.left));
    var top = b.top; if (left === b.left || (left >= b.left && left < b.right)) top = b.bottom + 8;
    if (top + h > vh - 8) top = Math.max(8, b.top - h - 8);
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
    grid.querySelectorAll('.mapbtn[aria-expanded="true"]').forEach(function(x){x.setAttribute('aria-expanded','false');});
    var mb = card.querySelector('.mapbtn'); if (mb) mb.setAttribute('aria-expanded','true');
  }
  function hideTip(){
    clearTimeout(tipTimer); tip.hidden = true; tipCard = null;
    grid && grid.querySelectorAll('.mapbtn[aria-expanded="true"]').forEach(function(x){x.setAttribute('aria-expanded','false');});
  }

  var finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (finePointer) {
    grid.addEventListener('mouseover', function(e){
      var card = e.target.closest('.card:not(.edit)'); if (!card || card === tipCard) return;
      clearTimeout(tipTimer); tipTimer = setTimeout(function(){ showTip(card); }, 280);
    });
    grid.addEventListener('mouseleave', hideTip);
    grid.addEventListener('mouseout', function(e){
      var card = e.target.closest('.card'); if (card && !card.contains(e.relatedTarget)) { clearTimeout(tipTimer); if (tipCard === card) hideTip(); }
    });
  }
  window.addEventListener('scroll', function(){ if (!tip.hidden) hideTip(); }, {passive:true});

  /* ---- Actions ---- */
  function copy(btn){
    var v = btn.dataset.copy;
    var done = function(){btn.textContent = 'Copié ✓'; btn.classList.add('done'); setTimeout(function(){btn.textContent = 'Copier'; btn.classList.remove('done');}, 1500);};
    var fallback = function(){var el = btn.parentNode.querySelector('.num'); var s = window.getSelection(); var rg = document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); btn.textContent = 'Ctrl+C';};
    try { navigator.clipboard.writeText(v).then(done, fallback); } catch (e) { fallback(); }
  }

  function sortRows(){
    function k(c){c = String(c).toUpperCase(); if (c === '2A') return 20.1; if (c === '2B') return 20.2; var n = parseFloat(c); return isNaN(n) ? 9999 : n;}
    rows.sort(function(a,b){return k(a[0]) - k(b[0]);});
  }

  function buildDocument(){
    var json = JSON.stringify({updated: new Date().toISOString().slice(0,10), rows: rows}).replace(/</g,'\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body>' +
      '<title>Numéros directs des SAMU</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">\n' +
      '<style id="css">' + document.getElementById('css').textContent + '</style>\n\n<div id="app"></div>\n\n' +
      '<script type="application/json" id="state">' + json + '<\/script>\n\n' +
      '<script id="main">' + document.getElementById('main').textContent + '<\/script>' +
      '</body></html>';
  }

  async function save(){
    rows = rows.map(function(r){return r.map(function(v){return String(v).trim();});})
               .filter(function(r){return r[0] || r[1] || r[3];});
    sortRows();
    var btn = document.getElementById('save'); if (btn) btn.disabled = true;
    if (STANDALONE) {
      try {
        saved = {updated: new Date().toISOString().slice(0,10), rows: rows.map(function(r){return r.slice();})};
        localStorage.setItem(LS_KEY, JSON.stringify(saved));
        editing = false; renderActs(); render();
        setStatus('Enregistré dans ce navigateur. Les autres postes gardent leur propre liste.', 'ok');
      } catch (e) {
        setStatus('Ce navigateur bloque l\'enregistrement local. Les modifications seront perdues à la fermeture.', 'err');
        if (btn) btn.disabled = false;
      }
      return;
    }
    if (!artifactApi) { setStatus('Enregistrement impossible depuis cette vue : seul le propriétaire de la page peut sauvegarder.', 'err'); if (btn) btn.disabled = false; return; }
    setStatus('Enregistrement…');
    try {
      await artifactApi.publish(buildDocument());
      setStatus('Enregistré. La page se recharge…', 'ok');
    } catch (e) {
      var c = e && e.code;
      setStatus(c === 'conflict' ? 'Une autre version a été enregistrée entre-temps ; la page se recharge avec celle-ci.'
        : (c === 'not_granted' || c === 'not_writer') ? 'Vous n\'avez pas les droits pour modifier cette page.'
        : 'L\'enregistrement a échoué. Réessayez.', 'err');
      if (btn) btn.disabled = false;
    }
  }

  qInput.addEventListener('input', function(e){ query = e.target.value; render(); });
  qInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !editing) { var b = grid.querySelector('.copy'); if (b) { e.preventDefault(); copy(b); } }
    if (e.key === 'Escape') { qInput.value = ''; query = ''; render(); }
  });

  document.addEventListener('click', function(e){
    var t = e.target.closest('button');
    if (!t) { if (!tip.hidden && !finePointer) hideTip(); return; }
    if (t.dataset.zone) {
      zone = t.dataset.zone;
      document.querySelectorAll('[data-zone]').forEach(function(b){b.setAttribute('aria-pressed', String(b === t));});
      render(); return;
    }
    if (t.dataset.map !== undefined) {
      var card = t.closest('.card');
      if (tipCard === card) hideTip(); else showTip(card);
      return;
    }
    if (t.id === 'edit') { editing = true; setStatus(''); renderActs(); render(); return; }
    if (t.id === 'cancel') { editing = false; rows = saved.rows.map(function(r){return r.slice();}); setStatus(''); renderActs(); render(); return; }
    if (t.id === 'save') { save(); return; }
    if (t.id === 'add') {
      rows.push(['', '', 'Samu ', '']);
      zone = 'all'; document.querySelectorAll('[data-zone]').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.zone === 'all'));});
      render(); var cs = grid.querySelectorAll('.card.edit'); var last = cs[cs.length - 1]; if (last) last.querySelector('input').focus(); return;
    }
    if (t.dataset.del !== undefined) { rows.splice(Number(t.dataset.del), 1); render(); return; }
    if (t.dataset.copy) copy(t);
  });

  grid.addEventListener('input', function(e){
    var card = e.target.closest('.card.edit'); if (!card) return;
    rows[Number(card.dataset.i)][Number(e.target.dataset.f)] = e.target.value;
  });

  renderActs(); render();
  if (window.claude && window.claude.use) window.claude.use('artifact').then(function(a){ artifactApi = a; }, function(){});
})();
</script>

</body>
</html>
